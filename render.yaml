# Deploy di PROVA GRATUITA su Render: New > Blueprint > collega il repository.
# Piano free: l'app si addormenta dopo 15 minuti di inattivita' (primo accesso lento), il database gratuito scade dopo 30 giorni.
# Per la produzione: plan: starter (web) e plan: basic-256mb (database), poi Sync Blueprint.
services:
  - type: web
    name: td-cash
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BASE_URL
        value: https://td-cash.onrender.com   # sostituire con l'URL assegnato, poi con https://cash.toscanadiagnostica.it
      - key: DATABASE_URL
        fromDatabase:
          name: td-cash-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: "10"
      - key: REQUIRE_TOTP_FOR_ADMINS
        value: "true"
      - key: SEED_SUPERADMIN_EMAIL
        value: francesco.epifani@toscanadiagnostica.it
      - key: SEED_SUPERADMIN_NAME
        value: Francesco Epifani
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false   # inserire a mano nel pannello (min 12 caratteri): richiesta al primo accesso, poi da cambiare
      - key: ENTRA_TENANT_ID
        value: ""
      - key: ENTRA_CLIENT_ID
        value: ""
      - key: ENTRA_CLIENT_SECRET
        value: ""
databases:
  - name: td-cash-db
    plan: free
    region: frankfurt
    databaseName: cash
    user: cash
